name: Compilar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Descomprimir
        run: unzip -o WidgetMusica.zip
      - name: Compilar
        working-directory: WidgetMusica
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MiWidgetMusical-apk
          path: WidgetMusica/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en Releases (link fijo de descarga)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mi Widget Musical ${{ github.run_number }}
          files: WidgetMusica/app/build/outputs/apk/debug/app-debug.apk
